[package]
name = "superphoto"
version = "0.1.0"
description = "SuperPhoto — studio de retouche photographique Astro + Rust"
authors = ["SuperPhoto"]
license = "MIT"
repository = "https://superprint.cc"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "superphoto_lib"
# Desktop uniquement : le binaire principal lie la lib en rlib. Les cibles
# mobiles (cdylib/staticlib) pourront être réactivées si SuperPhoto est porté
# sur iOS/Android.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
