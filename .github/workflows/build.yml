name: Build SuperPhoto

# Trois déclencheurs :
#   • push sur main / tag v*  → installeurs à jour, artefacts téléchargeables 90 jours ;
#   • tag v*                  → en plus, une Release GitHub avec tous les fichiers ;
#   • manuel                  → pour reconstruire à la demande.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Créer une Release GitHub avec les binaires produits'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Version web : validée à chaque build, jamais publiée ───────────────
  # Le zip web n'est pas distribué sur GitHub : il ne sert qu'à un envoi FTP
  # personnel, et se fabrique en local avec `npm run build:web:zip`. La CI se
  # contente donc de construire le dossier pour détecter toute régression des
  # liens relatifs, sans conserver d'artefact téléchargeable.
  web:
    name: Web (FTP, non publiée)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run check

      - name: Construire la version web (liens relatifs + zip)
        run: npm run build:web:zip

  # ── 2. Applications de bureau : Windows, Linux, macOS ─────────────────────
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    # ── Signature de code : facultative, jamais bloquante ────────────────────
    # Ces variables portent le préfixe SP_ exprès : Tauri ne les lit pas sous
    # ce nom. Elles servent uniquement aux `if:` ci-dessous, pour savoir si les
    # secrets ont été configurés. Les étapes « Activer la signature » les
    # recopient sous leur vrai nom (APPLE_*, AZURE_*) uniquement lorsqu'elles
    # sont remplies. Sans secrets, le comportement est exactement celui d'avant :
    # des installeurs non signés, et un build vert.
    # Voir docs/SIGNING.md pour créer ces secrets.
    env:
      CI: true
      SP_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      SP_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      SP_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      SP_APPLE_ID: ${{ secrets.APPLE_ID }}
      SP_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      SP_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SP_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      SP_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SP_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SP_AZURE_TS_ENDPOINT: ${{ vars.AZURE_TS_ENDPOINT }}
      SP_AZURE_TS_ACCOUNT: ${{ vars.AZURE_TS_ACCOUNT }}
      SP_AZURE_TS_PROFILE: ${{ vars.AZURE_TS_PROFILE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            bundles: nsis
            args: ''
            artifact: superphoto-windows-x64
            bundle: src-tauri/target/release/bundle
          - name: Linux x64
            platform: ubuntu-22.04
            bundles: deb,appimage
            args: ''
            artifact: superphoto-linux-x64
            bundle: src-tauri/target/release/bundle
          - name: macOS universel
            platform: macos-latest
            bundles: dmg
            args: '--target universal-apple-darwin'
            artifact: superphoto-macos-universal
            bundle: src-tauri/target/universal-apple-darwin/release/bundle

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Dépendances Linux (WebKitGTK, AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libxdo-dev libfuse2 patchelf

      - name: Dépendances frontend
        run: npm ci

      # ── Windows : Azure Trusted Signing ────────────────────────────────────
      - name: Activer la signature Windows
        if: matrix.platform == 'windows-latest' && env.SP_AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          if (-not $env:SP_AZURE_TS_ENDPOINT -or -not $env:SP_AZURE_TS_ACCOUNT -or -not $env:SP_AZURE_TS_PROFILE) {
            throw "Signature Windows demandée mais les variables AZURE_TS_ENDPOINT / AZURE_TS_ACCOUNT / AZURE_TS_PROFILE ne sont pas définies (Settings > Secrets and variables > Actions > Variables)."
          }

          # Les identifiants Azure sont lus par trusted-signing-cli.
          "AZURE_CLIENT_ID=$env:SP_AZURE_CLIENT_ID"     | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AZURE_CLIENT_SECRET=$env:SP_AZURE_CLIENT_SECRET" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AZURE_TENANT_ID=$env:SP_AZURE_TENANT_ID"     | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          cargo install trusted-signing-cli --locked

          # trusted-signing-cli s'appuie sur signtool.exe du Windows SDK.
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($signtool) {
            $signtool.Directory.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
            Write-Host "signtool : $($signtool.FullName)"
          } else {
            Write-Host "::warning::signtool.exe introuvable — la signature risque d'échouer."
          }

          # `--config` fusionne ce fragment par-dessus tauri.conf.json : le dépôt
          # reste inchangé, et sans secret la clé signCommand n'existe pas.
          $cmd = 'trusted-signing-cli -e "{0}" -a "{1}" -c "{2}" %1' -f $env:SP_AZURE_TS_ENDPOINT, $env:SP_AZURE_TS_ACCOUNT, $env:SP_AZURE_TS_PROFILE
          @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Depth 6 |
            Set-Content -Path 'src-tauri\tauri.signing.json' -Encoding utf8
          Get-Content 'src-tauri\tauri.signing.json' | Write-Host
          "TAURI_EXTRA_ARGS=--config src-tauri/tauri.signing.json" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "✔ Signature Windows activée"

      # ── macOS : certificat Developer ID + notarisation ──────────────────────
      - name: Activer la signature macOS
        if: matrix.platform == 'macos-latest' && env.SP_APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          {
            printf 'APPLE_CERTIFICATE=%s\n'          "$SP_APPLE_CERTIFICATE"
            printf 'APPLE_CERTIFICATE_PASSWORD=%s\n' "$SP_APPLE_CERTIFICATE_PASSWORD"
            printf 'APPLE_SIGNING_IDENTITY=%s\n'     "$SP_APPLE_SIGNING_IDENTITY"
            printf 'APPLE_ID=%s\n'                   "$SP_APPLE_ID"
            printf 'APPLE_PASSWORD=%s\n'             "$SP_APPLE_PASSWORD"
            printf 'APPLE_TEAM_ID=%s\n'              "$SP_APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "✔ Signature macOS + notarisation activées"

      - name: Construire les installeurs
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}

      - name: Lister les fichiers produits
        shell: bash
        run: find "${{ matrix.bundle }}" -maxdepth 3 -type f | sort

      # Contrôle : si des secrets sont configurés, la signature DOIT être valide.
      # Sinon on se contente d'afficher l'état, sans faire échouer le build.
      - name: Vérifier la signature Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $files = Get-ChildItem 'src-tauri/target/release' -Recurse -File -Include *.exe, *.msi -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bundle\\' }
          if (-not $files) { Write-Host "Aucun installeur à vérifier."; exit 0 }
          $ko = @()
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0,-52} {1}" -f $f.Name, $s.Status | Write-Host
            if ($env:SP_AZURE_CLIENT_ID -and $s.Status -ne 'Valid') { $ko += $f.Name }
          }
          if ($ko) { throw "Signature absente ou invalide : $($ko -join ', ')" }

      - name: Vérifier la signature macOS
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -o pipefail
          # `|| true` : sous `-eo pipefail`, un `head` qui ferme le tube envoie
          # SIGPIPE à `find` et ferait échouer l'étape.
          app=$(find "${{ matrix.bundle }}" -maxdepth 3 -name '*.app' | head -n1 || true)
          [ -z "$app" ] && { echo "Aucun .app trouvé."; exit 0; }
          echo "── codesign ──"; codesign -dv --verbose=2 "$app" 2>&1 || true
          echo "── spctl ──";   spctl -a -vvv -t exec "$app" 2>&1 || true
          if [ -n "$SP_APPLE_CERTIFICATE" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -vvv -t exec "$app"
            xcrun stapler validate "$app"
          fi

      - name: Publier les installeurs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 90

  # ── 3. Release : tous les fichiers d'un coup, sur un tag ───────────────────
  release:
    name: Release GitHub
    needs: [web, desktop]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aplatir l'arborescence
        run: |
          mkdir -p release
          # Aucun `.zip` : la version web n'est pas distribuée sur GitHub.
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} release/ \;
          ls -lh release

      # Copies à nom stable : les liens « latest/download » du README pointent
      # toujours vers la dernière version, sans avoir à connaître son numéro.
      - name: Ajouter les noms stables
        run: |
          cd release
          set -- $(ls *_x64-setup.exe 2>/dev/null | head -n1)
          [ -n "$1" ] && cp "$1" SuperPhoto-Windows-x64-setup.exe || true
          set -- $(ls *_universal.dmg 2>/dev/null | head -n1)
          [ -n "$1" ] && cp "$1" SuperPhoto-macOS-universal.dmg || true
          set -- $(ls *_amd64.AppImage 2>/dev/null | head -n1)
          [ -n "$1" ] && cp "$1" SuperPhoto-Linux-x86_64.AppImage || true
          set -- $(ls *_amd64.deb 2>/dev/null | head -n1)
          [ -n "$1" ] && cp "$1" SuperPhoto-Linux-amd64.deb || true
          ls -lh

      # Empreintes : permet de vérifier qu'un fichier téléchargé est bien celui
      # publié (intégrité). Les noms stables et versionnés sont tous listés, donc
      # la somme reste valable quel que soit le lien utilisé.
      - name: Empreintes SHA-256
        run: |
          cd release
          # `SHA256SUMS` ne doit pas se lister lui-même : on le supprime d'abord,
          # ce qui rend l'étape rejouable sans changer le résultat.
          rm -f SHA256SUMS
          sha256sum * | LC_ALL=C sort -k2 > SHA256SUMS
          echo "── SHA256SUMS ──"
          cat SHA256SUMS

      - name: Vérifier les empreintes
        run: |
          cd release
          # Recalcule et compare : une somme fausse ne doit jamais être publiée.
          sha256sum -c SHA256SUMS --quiet
          echo "✔ $(wc -l < SHA256SUMS) empreintes vérifiées"

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('nightly-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('SuperPhoto {0}', github.ref_name) || format('SuperPhoto — build {0}', github.run_number) }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          body: |
            SuperPhoto — photo retouching studio.

            | Platform | File |
            | --- | --- |
            | Windows | `SuperPhoto-Windows-x64-setup.exe` (NSIS) |
            | Linux | `SuperPhoto-Linux-amd64.deb`, `SuperPhoto-Linux-x86_64.AppImage` |
            | macOS (Apple Silicon + Intel) | `SuperPhoto-macOS-universal.dmg` |

            The versioned files (`SuperPhoto_<version>_*`) are kept alongside the
            stable names used by the README quick-download links.

            The web build is not attached: it is a static folder meant for a
            personal FTP deploy, and is produced locally with
            `npm run build:web:zip`. The hosted editor lives at
            <https://app.zigmoon.com/superphoto/>.

            ### Verify your download

            `SHA256SUMS` lists the fingerprint of every file below. After
            downloading, check it before running anything:

            ```bash
            # Linux
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            ```bash
            # macOS — keep only the line of the file you downloaded
            shasum -a 256 -c <(grep SuperPhoto-macOS-universal.dmg SHA256SUMS)
            ```

            ```powershell
            # Windows PowerShell
            Get-FileHash .\SuperPhoto-Windows-x64-setup.exe -Algorithm SHA256
            ```

            Compare the value with the line for that file in `SHA256SUMS`. A
            mismatch means the download is incomplete or has been tampered with:
            delete it and download again.

            No code signing is applied: on first launch Windows shows SmartScreen
            and macOS needs a right-click → Open.

            ### Check whether a file is signed

            ```powershell
            Get-AuthenticodeSignature .\SuperPhoto-Windows-x64-setup.exe | Format-List Status, SignerCertificate
            ```

            ```bash
            spctl -a -vvv -t exec /Applications/SuperPhoto.app
            ```

            `Valid` / `accepted` means the build is signed: SmartScreen and
            Gatekeeper stay quiet. Anything else means it is unsigned — use the
            workaround above.
          files: release/*
          fail_on_unmatched_files: false
